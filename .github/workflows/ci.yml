# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Files this repository owns, i.e. everything outside the submodules.
  EXCLUDES: >-
    -not -path './.git/*'
    -not -path './robot-description/*'
    -not -path './robot-joystick/*'
    -not -path './limxsdk-lowlevel/*'
    -not -path './.venv/*'
    -not -path './__pycache__/*'

jobs:
  checks:
    name: Lint, environment and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules are not our content to test, and the asset repository is
          # large. The gate below verifies they are *declared*, not checked out.
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Byte-compile repository-owned Python
        run: |
          set -euo pipefail
          mapfile -d '' files < <(eval "find . -type f -name '*.py' $EXCLUDES -print0")
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No repository-owned .py files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "py_compile $f"
            python3 -m py_compile "$f"
          done

      - name: Ruff lint
        run: uvx ruff check .

      - name: Submodules are declared
        run: |
          set -euo pipefail
          if ! [ -s .gitmodules ]; then
            echo "::error::.gitmodules is missing or empty"
            exit 1
          fi
          # `git submodule status` lists declared entries even when they are not
          # checked out (prefixed with '-').
          status_out=$(git submodule status || true)
          echo "$status_out"
          if [ -z "$status_out" ]; then
            echo "::error::git submodule status produced no output"
            exit 1
          fi

      - name: Base environment resolves
        run: |
          set -euo pipefail
          # The `sdk` extra needs the limxsdk-lowlevel submodule, which is not
          # checked out here, so only the base environment is resolved.
          uv lock --check
          uv venv
          uv pip install mujoco pyyaml
          uv run --no-project python -c "import mujoco, yaml; print('mujoco', mujoco.__version__)"

      - name: Communication is limxsdk-only
        run: |
          set -euo pipefail
          # limxsdk is the only transport; the simulator must not regain a
          # second messaging stack.
          if eval "find . -type f -name '*.py' $EXCLUDES -print0" \
               | xargs -0 -r grep -nE '^[[:space:]]*(import|from)[[:space:]]+mros'; then
            echo "::error::Python sources must not import a second messaging stack"
            exit 1
          fi

      - name: No hard-coded private addresses
        run: |
          set -euo pipefail
          # ALLOWLIST:
          #   - 127.0.0.1  documented loopback default for the sim SDK.
          #   - 10.192.1.2 referenced only in Markdown prose that
          #                points at the sibling tron2-rl-deploy-ros
          #                repo (per its SECURITY.md). This repo does
          #                not embed the literal in source; the
          #                shipped placeholder token is <robot-ip>.
          hits=$(grep -R -nE \
              '(^|[^0-9])(10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|169\.254\.[0-9]+\.[0-9]+)([^0-9]|$)' \
              --include='*.md' --include='*.py' --include='*.yml' --include='*.yaml' \
              --include='*.toml' \
              --exclude-dir=.git --exclude-dir=robot-description \
              --exclude-dir=robot-joystick --exclude-dir=limxsdk-lowlevel \
              --exclude-dir=.venv --exclude-dir=__pycache__ . || true)
          filtered=$(echo "$hits" | grep -vE '10\.192\.1\.2' || true)
          if [ -n "$filtered" ]; then
            echo "::error::Private address found; use the <robot-ip> placeholder or 127.0.0.1:"
            echo "$filtered"
            exit 1
          fi

      - name: No caches, models, binaries or captures committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -iE '(^|/)__pycache__(/|$)|\.(pyc|pyo|onnx|pt|pth|ckpt|so|dll|dylib|lib|whl|bag|mcap)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These must not live in this repository:"
            echo "$bad"
            exit 1
          fi

      - name: Unresolved license / TODO scan
        run: |
          set -euo pipefail
          if grep -rniE 'proprietary|confidential|todo: license|unknown license' \
               README.md THIRD_PARTY_NOTICES.md CHANGELOG.md CONTRIBUTING.md SECURITY.md NOTICE; then
            echo "::error::Unresolved license / provenance markers in top-level docs"
            exit 1
          fi

      - name: Documentation media carries no identifying metadata
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob
          media=(doc/*.jpg doc/*.jpeg doc/*.png doc/*.gif doc/*.GIF doc/gif/*.gif doc/gif/*.GIF doc/gif/*.png)
          if [ ${#media[@]} -eq 0 ]; then
            echo "No documentation media committed yet; nothing to scan."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl
          bad=0
          for img in "${media[@]}"; do
            hits=$(exiftool "$img" | grep -iE '(gps|serial|author|artist|owner)' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$img::EXIF discloses: $hits"
              bad=$((bad + 1))
            fi
          done
          [ $bad -eq 0 ]
